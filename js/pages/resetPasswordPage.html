<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karbon Zero</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="../../css/globalGrids.css" />
    <link rel="stylesheet" href="../../css/login.css" />
  </head>
  <body class="d-flex justify-content-center align-items-center">
    <div class="container d-flex mx-4">
      <div id="left-side" class="col-12 col-md-6 justify-content-center px-5 text-center d-none d-md-flex flex-column">
        <img src="../../assets/imgs/logo.svg" alt="Logo Karbon Zero">
        <h2>Restablece tu contraseña</h2>
      </div>
      <div id="right-side" class="col-12 col-md-6 d-flex flex-column py-3 justify-content-evenly px-5">
        <div>
          <div class="login-entry py-2">
            <label for="emailtxt" class="form-label">Código de confirmación</label>
            <input
              type="text"
              name="emailtxt"
              id="emailtxt"
              class="form-control py-2"
            />
          </div>
          <div class="login-entry py-2">
            <label for="contraseñatxt" class="form-label">Nueva contraseña</label>
            <div class="input-group">
              <input
              type="password"
              name="newcontraseñatxt"
              id="newPassword"
              class="form-control py-2"
            />
            <button class="btn" type="button" id="hide-password"><i class="bi bi-eye-fill"></i></button>
          </div>
          </div>
          <div class="login-entry py-2">
            <label for="contraseñatxt" class="form-label">Confirmar contraseña</label>
            <div class="input-group">
              <input
              type="password"
              name="confirmcontraseñatxt"
              id="confirmPassword"
              class="form-control py-2"
            />
            <button class="btn" type="button" id="hide-password"><i class="bi bi-eye-fill"></i></button>
          </div>
          </div>
        </div>
        <div class="d-flex justify-content-center">
          <button id="login-button" type="button" class="kz-button-create my-3 p-3">Guardar contraseña</button>
        </div>
      </div>
    </div>
  </body>
  <script type="module" src="../controllers/resetPasswordController.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</html>
