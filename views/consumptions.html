<!-- Consumptions Section -->
<div class="container py-4">
    <h2 class="general-title">
        Consumos
    </h2>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="input-group w-50">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" placeholder="Buscar">
        </div>
        <div class="d-flex gap-2">
            <select class="form-select" aria-label="Mes">
                <option selected>Mes</option>
                <option value="1">Enero</option>
                <option value="2">Febrero</option>
                <option value="3">Marzo</option>
            </select>
            <select class="form-select" aria-label="Trimestre">
                <option selected>Trimestre</option>
                <option value="1">Q1</option>
                <option value="2">Q2</option>
                <option value="3">Q3</option>
            </select>
            <button class="kz-button-create"><i class="bi bi-plus-circle"></i> Crear consumo</button>
        </div>
    </div>

    <ul class="nav nav-tabs mb-3" id="tabList"></ul>
    <div class="tab-content" id="tabContent"></div>
</div>
